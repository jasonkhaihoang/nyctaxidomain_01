version: 2

models:
  - name: mart_driver_scorecard
    description: >
      Driver performance, ranked within garage and fleet-wide. Ranking is on
      revenue per online hour, not gross revenue -- gross rewards whoever worked
      the most hours, which is a roster fact rather than a performance one.
      Drivers below the hours floor are carried but flagged.
    columns:
      - name: driver_key
        tests: [unique, not_null]
      - name: is_below_ranking_floor
        tests: [not_null]
      - name: occupancy_rate
        description: '{{ doc("occupancy_rate") }}'

  - name: mart_vehicle_utilisation
    description: Asset utilisation for the period with downtime netted out.
    columns:
      - name: vehicle_key
        tests: [unique, not_null]

  - name: mart_trip_quality_scorecard
    description: >
      What proportion of the feed is trustworthy and whose records are not.
      Aggregated through the junk dimension so every verdict is groupable.

exposures:
  - name: garage_operations_review
    type: dashboard
    maturity: high
    description: Monthly depot review. Drives driver coaching and vehicle reallocation.
    depends_on:
      - ref('mart_driver_scorecard')
      - ref('mart_vehicle_utilisation')
      - ref('agg_garage_monthly')
    owner:
      name: Fleet Operations
      email: fleet-ops@harbourpoint.example

  - name: data_quality_review
    type: analysis
    maturity: medium
    description: Standing review of feed quality by vendor.
    depends_on:
      - ref('mart_trip_quality_scorecard')
    owner:
      name: Data Platform
      email: data-platform@harbourpoint.example
