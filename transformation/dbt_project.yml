name: 'nyc_taxi_transformation'
version: '1.0.0'
config-version: 2

profile: 'nyc_taxi'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  nyc_taxi_transformation:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: core
      +materialized: table
      dimensions:
        +schema: core
        +materialized: table
      core:
        +schema: core
        +materialized: table
