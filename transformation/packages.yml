# Studio-owned dbt package manifest (VD-3794), shared by DuckDB-local,
# MotherDuck and Fabric Warehouse. (Named for DuckDB because that is where it
# started; the pins are platform-neutral.) Static pins, no domain coordinates.
# Seeded skip_if_exists — a domain that adds its own packages keeps them.
#
# No Elementary Fabric Spark override here: that mirror exists only to make
# Elementary's macros compile on dbt-fabricspark, for which Elementary ships no
# adapter macros. dbt-duckdb and dbt-fabric both run stock Elementary — the
# `fabric__` macros are upstream.
packages:
  - package: dbt-labs/dbt_utils
    version: ['>=1.3.0', '<2.0.0']
  - package: elementary-data/elementary
    version: ['>=0.15.0', '<1.0.0']
  - package: metaplane/dbt_expectations
    version: ['>=0.10.0', '<1.0.0']
  - package: dbt-labs/dbt_project_evaluator
    version: ['>=1.0.0', '<2.0.0']
