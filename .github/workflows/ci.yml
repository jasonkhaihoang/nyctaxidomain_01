name: LocalDuck Static CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  adr-numbering:
    name: ADR numbering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run ADR numbering check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/adr_lint.py --pr-number "${{ github.event.pull_request.number }}"

  static-validation:
    name: Static validation (no data-plane gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: vars.FAKE_WORLD == ''

      - name: Resolve layout
        run: echo "PROJ=$([ -f transformation/dbt_project.yml ] && echo transformation || echo .)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install static validation tools
        run: |
          pip install ruff sqlfluff sqlfluff-templater-dbt pyyaml 'dbt-duckdb>=1.8' --quiet
          case "$(uname -m)" in
            x86_64) gitleaks_arch=x64 ;;
            aarch64|arm64) gitleaks_arch=arm64 ;;
            *) echo "unsupported gitleaks architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_${gitleaks_arch}.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

      - name: Add fake-world dbt shim to PATH
        if: vars.FAKE_WORLD != ''
        run: echo "/fakeworld-shims" >> "$GITHUB_PATH"

      - name: Python lint
        run: ruff check . --extend-exclude .github

      - name: Prepare dbt-aware SQL linting
        env:
          SQLFLUFF_DBT_PROFILE: dbt_localduck_static
          SQLFLUFF_DBT_TARGET: static
        run: |
          dbt deps --project-dir "$PROJ" --quiet
          python3 - <<'PYEOF'
          import configparser
          import os

          sqlfluff_path = os.path.join(os.environ["PROJ"], ".sqlfluff")
          config = configparser.RawConfigParser()
          config.read(sqlfluff_path)  # no-op when absent — never clobbers an existing
                                      # domain-repo .sqlfluff's other settings.
          existing_sqlfluff = dict(config["sqlfluff"]) if config.has_section("sqlfluff") else {}
          config["sqlfluff"] = {**existing_sqlfluff, "templater": "dbt"}
          # Preserve any other dbt-templater key the domain repo set (e.g.
          # dbt_skip_compilation, templater context vars) — override only the
          # four coordinates Gate 0 owns.
          existing_dbt = (
              dict(config["sqlfluff:templater:dbt"])
              if config.has_section("sqlfluff:templater:dbt")
              else {}
          )
          config["sqlfluff:templater:dbt"] = {
              **existing_dbt,
              "profiles_dir": ".github/profiles",
              "profile": os.environ["SQLFLUFF_DBT_PROFILE"],
              "target": os.environ["SQLFLUFF_DBT_TARGET"],
              "project_dir": os.environ["PROJ"],
          }
          with open(sqlfluff_path, "w") as f:
              config.write(f)
          PYEOF

      - name: DuckDB SQL style
        run: sqlfluff lint "$PROJ/models" --dialect duckdb

      - name: Secret scan
        run: gitleaks detect --source . --no-banner

      - name: Parse dbt project
        run: |
          dbt parse --project-dir "$PROJ" --profiles-dir .github/profiles \
            --profile dbt_localduck_static --target static --quiet

      - name: Compile dbt project
        run: |
          dbt compile --project-dir "$PROJ" --profiles-dir .github/profiles \
            --profile dbt_localduck_static --target static --quiet

      - name: Schema validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/schema_gate.py --manifest "$PROJ/target/manifest.json" \
            --repo "${{ github.repository }}" --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" --output schema_gate.json

      - name: dbt project scorecard
        run: |
          python3 .github/scripts/scorecard.py --manifest "$PROJ/target/manifest.json" \
            --agents-md AGENTS.md > scorecard.json

  static-summary:
    name: Static-validation scope
    if: always()
    needs: [adr-numbering, static-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Post static-validation scope
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- localduck-static-ci -->';
            const body = `${marker}\n## LocalDuck static validation\n\nThis PR ran static checks only: ADR hygiene, linting, secret scanning, dbt dependency resolution/parse/compile, schema validation, and scorecard. Data-plane builds, dbt tests, production-state comparison, and remote-platform gates are intentionally unavailable.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
